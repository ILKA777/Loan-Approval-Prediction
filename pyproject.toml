[project]
name = "loan-approval"
version = "0.1.0"
description = "Production-oriented ML pipeline for loan approval prediction"
authors = [
    {name = "Ilya Morin",email = "iomorin@edu.hse.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
packages = [
    { include = "loan_approval", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=loan_approval --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["loan_approval"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["loan_approval"]
branch = true
